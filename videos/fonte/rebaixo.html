  var alvo = [Math.max(-17, Math.min(17, x)) * 0.8, 0, Math.max(-14, Math.min(10, z)) * 0.8 - 2], k = Math.min(1, (u - ch) / 1.2);
  if (u < ch + 1.2) return [mix(x, alvo[0], suave(k)), piso, mix(z, alvo[2], suave(k)), 0.9 - 0.15 * k];

}

];
