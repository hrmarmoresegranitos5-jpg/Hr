name: Checar serviços e enviar push

on:
  schedule:
    - cron: '0 10 * * *'   # 07:00 Bahia — avisos do dia + resumo da manhã
    - cron: '0 15 * * *'   # 12:00 Bahia — serviços cadastrados de manhã
  workflow_dispatch:        # botão "Run workflow" na aba Actions, pra testar na hora

jobs:
  checar-servicos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar firebase-admin
        run: |
          mkdir -p /tmp/fb && cd /tmp/fb
          npm init -y > /dev/null
          npm install firebase-admin

      - name: Rodar checar-servicos.cjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NODE_PATH: /tmp/fb/node_modules
        run: node checar-servicos.cjs
