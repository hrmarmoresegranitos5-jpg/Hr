name: Checar serviços e enviar push

on:
  schedule:
    # Horários em UTC (Bahia = UTC-3). Várias checagens por dia: o GitHub pode atrasar
    # um agendamento, e assim um serviço cadastrado de manhã ainda é avisado no mesmo dia.
    - cron: '0 9 * * *'    # 06:00 Bahia — avisos do dia + resumo da manhã
    - cron: '0 11 * * *'   # 08:00 Bahia
    - cron: '0 13 * * *'   # 10:00 Bahia
    - cron: '0 15 * * *'   # 12:00 Bahia
    - cron: '0 17 * * *'   # 14:00 Bahia
  workflow_dispatch:        # botão "Run workflow" na aba Actions, pra testar na hora

jobs:
  checar-servicos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar firebase-admin
        run: |
          mkdir -p /tmp/fb && cd /tmp/fb
          npm init -y > /dev/null
          npm install firebase-admin

      - name: Rodar checar-servicos.cjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NODE_PATH: /tmp/fb/node_modules
        run: node checar-servicos.cjs
