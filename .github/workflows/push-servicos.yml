name: Checar serviços e enviar push

on:
  schedule:
    - cron: '0 10 * * *'   # 07:00 horário da Bahia (UTC-3) — avisos de início/entrega do dia
    - cron: '0 15 * * *'   # 12:00 — pega serviços cadastrados durante a manhã
  workflow_dispatch:        # botão "Run workflow" na aba Actions, pra testar na hora

jobs:
  checar-servicos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependências
        working-directory: scripts
        run: npm install
      - name: Rodar checagem de serviços
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node checar-servicos.js
