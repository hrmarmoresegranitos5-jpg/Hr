name: Checar orçamentos novos e enviar push

on:
  schedule:
    - cron: '*/5 * * * *'   # a cada 5 minutos
  workflow_dispatch:        # botão "Run workflow" na aba Actions, pra testar na hora

jobs:
  checar-orcamentos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar firebase-admin
        run: |
          mkdir -p /tmp/fb && cd /tmp/fb
          npm init -y > /dev/null
          npm install firebase-admin

      - name: Rodar checar-orcamentos.cjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NODE_PATH: /tmp/fb/node_modules
        run: node checar-orcamentos.cjs
