name: Checar orçamentos novos e enviar push

on:
  schedule:
    - cron: '*/5 * * * *'   # a cada 5 minutos (o mínimo prático no GitHub Actions)
  workflow_dispatch:         # permite rodar manualmente na aba "Actions" do GitHub, pra testar

jobs:
  checar-orcamentos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        working-directory: scripts
        run: npm install

      - name: Rodar checagem de orçamentos
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node checar-orcamentos.js
